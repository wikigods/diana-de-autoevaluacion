<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Diana de Autoevaluación Circular</title>
    <!-- Bootstrap 5 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <!-- FONT AWESOME -->
    <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- Toastr CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" />
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<div class="container">
    <h1 class="text-center mb-4">Diana de Autoevaluación by WG</h1>

    <div class="mb-3">
        <label for="userName" class="form-label">Nombre:</label>
        <input type="text" class="form-control" id="userName" placeholder="Escribe tu nombre" oninput="drawDiana()" />
    </div>

    <div class="mb-3 d-flex justify-content-between align-items-center">
        <div class="d-flex w-100">
            <label for="newCriterion" class="form-label w-25">Agregar criterio:</label>
            <input type="text" class="form-control" id="newCriterion" />
        </div>
        <button class="btn btn-primary" onclick="addCriterion()">Agregar</button>
    </div>

    <div class="mb-3 d-flex justify-content-between align-items-center">
        <label for="levels" class="form-label">Niveles:</label>
        <input type="number" class="form-control w-25" id="levels" value="4" min="1" />
        <button class="btn btn-info" onclick="updateChart()">Actualizar niveles</button>
    </div>

    <div class="mb-3">
        <label for="showColorInTitles" class="form-label">Mostrar color en los títulos:</label>
        <input type="checkbox" id="showColorInTitles" onchange="drawDiana()" />
        <span class="ms-2">Marcar para usar el color del criterio en los títulos del gráfico.</span>
    </div>

    <div class="mb-3">
        <label for="valueInputs" class="form-label-valor">Valores y colores por criterio:</label>
        <div id="valueInputs"></div>
    </div>

    <canvas id="dianaCanvas" width="800" height="800"></canvas>

    <div class="text-center mt-4">
        <button class="btn btn-success btn-download" onclick="downloadImage()">Descargar imagen</button>
    </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<!-- Toastr JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/js/toastr.min.js"></script>

<script src="./js/main.js"></script>

</body>
</html>
